<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>无限画布 × 通义万相</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div class="mark">∞</div>
        <div>
          <h1>画布 × 万相</h1>
          <p id="page-label">正在识别当前页面…</p>
        </div>
      </header>
      <section id="canvas-actions" hidden>
        <p>把当前选中节点的提示词和已连接素材发送到万相。</p>
        <button id="send-to-wanx" class="primary">发送到万相</button>
      </section>
      <section id="wanx-actions" hidden>
        <p>万相页面收到提示词后不会自动生成；生成完成后可选择视频回传画布。</p>
        <button id="scan-videos" class="secondary">扫描页面视频</button>
        <div id="videos"></div>
      </section>
      <p id="status" role="status"></p>
      <footer>素材仅在本机浏览器扩展缓存中暂存</footer>
    </main>
  </body>
</html>
